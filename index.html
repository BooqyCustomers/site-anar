<!doctype html>
<html lang="sv" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0606" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Skyddsnät: kundsajten är publik, så CSP:n låser ner vad sidan får
      göra. connect-src: API:ts origin (sätts vid bygget) och 'self'
      för dev-proxyn. img-src: https (restaurangernas egna logotyper och
      bilder ligger på deras egna adresser). Externa skript och ramar
      bara från Stripe (betalning) och AWS WAF (*.awswaf.com:
      säkerhetskontrollen, utan den kan ingen boka, beställa eller
      skicka en cateringförfrågan). Systemtypsnitt - inga
      typsnittsanrop alls.
      frame-ancestors kan inte sättas i en meta-tagg - sätt den som riktigt
      svarshuvud i CloudFronts response headers policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://*.awswaf.com; frame-src https://maps.google.com https://www.google.com https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; connect-src 'self' %API_ORIGIN% https://api.stripe.com https://*.stripe.com https://*.awswaf.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Anar Restaurang &amp; Bar i Linköping - persisk och afghansk mat, à la carte, kolgrill och drinkmeny. Boka bord och beställ hem." />
    <title>ANAR Restaurang &amp; Bar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
